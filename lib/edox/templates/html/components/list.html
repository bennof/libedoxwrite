{% component components.list(node: object) %}
{% set tag = "ul" %}
{% if node.args.ordered %}
{% set tag = "ol" %}
{% endif %}
<{{ tag }}>
{{ components.helpers.join(nodes=node.children) }}
</{{ tag }}>
{%- endcomponent %}
